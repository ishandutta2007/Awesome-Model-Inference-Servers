<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.18)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.18)" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }

      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }

      @keyframes streamFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes waveDrift {
        0% { transform: translateX(0); }
        50% { transform: translateX(-30px); }
        100% { transform: translateX(0); }
      }

      .pulse-sphere-1 {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }

      .pulse-sphere-2 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        animation-delay: -3s;
        transform-origin: 1000px 280px;
      }

      .stream-line {
        stroke-dasharray: 12 18;
        animation: streamFlow 12s linear infinite;
      }

      .stream-fast {
        stroke-dasharray: 8 14;
        animation: streamFlow 7s linear infinite;
      }

      .floating-particle-1 {
        animation: floatParticle 5s ease-in-out infinite;
      }

      .floating-particle-2 {
        animation: floatParticle 6.5s ease-in-out infinite;
        animation-delay: -2s;
      }

      .floating-particle-3 {
        animation: floatParticle 4.5s ease-in-out infinite;
        animation-delay: -3.5s;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }

      .badge-text {
        font-family: 'SF Mono', Menlo, Consolas, Monaco, monospace;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- 2. Ambient Glowing Orbs (Dynamic Pulse in Background) -->
  <circle cx="180" cy="90" r="140" fill="#4f46e5" filter="url(#softGlow)" class="pulse-sphere-1" />
  <circle cx="1020" cy="290" r="160" fill="#ec4899" filter="url(#softGlow)" class="pulse-sphere-2" />
  <circle cx="920" cy="70" r="90" fill="#06b6d4" filter="url(#softGlow)" opacity="0.25" />
  <circle cx="320" cy="310" r="110" fill="#8b5cf6" filter="url(#softGlow)" opacity="0.3" />

  <!-- 3. Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- 4. Dynamic Dataflow / Wave Lines (Background) -->
  <g opacity="0.45">
    <path d="M -50 140 C 250 80, 450 210, 750 150 C 950 110, 1100 200, 1250 160" fill="none" stroke="url(#cyanBlue)" stroke-width="2.5" class="stream-line" />
    <path d="M -50 250 C 200 310, 500 190, 800 260 C 1000 310, 1150 230, 1250 240" fill="none" stroke="url(#primaryGlow)" stroke-width="2" class="stream-fast" />
  </g>

  <!-- 5. Floating Tokens & Particle Sparks -->
  <g class="floating-particle-1">
    <circle cx="120" cy="220" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1080" cy="140" r="4.5" fill="#f472b6" filter="url(#glow)" />
  </g>
  <g class="floating-particle-2">
    <circle cx="280" cy="70" r="4" fill="#a78bfa" filter="url(#glow)" />
    <circle cx="950" cy="220" r="3" fill="#34d399" filter="url(#glow)" />
  </g>
  <g class="floating-particle-3">
    <circle cx="840" cy="330" r="3.5" fill="#fb923c" filter="url(#glow)" />
    <circle cx="360" cy="320" r="2.5" fill="#60a5fa" filter="url(#glow)" />
  </g>

  <!-- 6. Foreground Content (High contrast, clearly above all backgrounds) -->
  <!-- Category Pill -->
  <g transform="translate(600, 55)">
    <rect x="-175" y="0" width="350" height="34" rx="17" fill="url(#pillGrad)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1.2" />
    <text x="0" y="21" fill="#c084fc" text-anchor="middle" class="badge-text" letter-spacing="1">⚡ HIGH-THROUGHPUT AI SERVING</text>
  </g>

  <!-- Main Title with Gradient Fill -->
  <text x="600" y="145" text-anchor="middle" class="title-text" font-size="44" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
    Awesome Model Inference Servers
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" class="subtitle-text" font-size="18" fill="#94a3b8">
    Production LLM Serving Engines, PagedAttention, KV Cache Offloading &amp; Custom AI Silicon
  </text>

  <text x="600" y="224" text-anchor="middle" class="subtitle-text" font-size="14.5" fill="#64748b">
    vLLM • SGLang • Triton • TensorRT-LLM • Ollama • llama.cpp • Groq • Cerebras • SambaNova
  </text>

  <!-- Feature Metric Pills (Foreground bottom bar) -->
  <g transform="translate(210, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="42" rx="10" fill="#0f172a" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#6366f1" />
      <text x="36" y="26" fill="#cbd5e1" class="badge-text" font-size="12">PagedAttention</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="190" height="42" rx="10" fill="#0f172a" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#a855f7" />
      <text x="36" y="26" fill="#cbd5e1" class="badge-text" font-size="12">Continuous Batching</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(410, 0)">
      <rect width="180" height="42" rx="10" fill="#0f172a" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#06b6d4" />
      <text x="36" y="26" fill="#cbd5e1" class="badge-text" font-size="12">RadixAttention</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(615, 0)">
      <rect width="165" height="42" rx="10" fill="#0f172a" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#ec4899" />
      <text x="36" y="26" fill="#cbd5e1" class="badge-text" font-size="12">Custom Silicon</text>
    </g>
  </g>
</svg>
