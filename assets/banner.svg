<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#060913"/><stop offset="50%" stop-color="#0d1424"/><stop offset="100%" stop-color="#05070f"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanBlue" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="rgba(99, 102, 241, 0.18)"/><stop offset="100%" stop-color="rgba(168, 85, 247, 0.18)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-15px) translateX(10px);opacity:.8}}@keyframes streamFlow{0%{stroke-dashoffset:400}}@keyframes waveDrift{0%{transform:translateX(0)}50%{transform:translateX(-30px)}}.pulse-sphere-1{animation:pulseGlow 6s ease-in-out infinite alternate;transform-origin:200px 100px}.pulse-sphere-2{animation:pulseGlow 7s ease-in-out infinite alternate;animation-delay:-3s;transform-origin:1000px 280px}.stream-line{stroke-dasharray:12 18;animation:streamFlow 12s linear infinite}.stream-fast{stroke-dasharray:8 14;animation:streamFlow 7s linear infinite}.floating-particle-1{animation:floatParticle 5s ease-in-out infinite}.floating-particle-2{animation:floatParticle 6.5s ease-in-out infinite;animation-delay:-2s}.floating-particle-3{animation:floatParticle 4.5s ease-in-out infinite;animation-delay:-3.5s}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text{font-weight:400;letter-spacing:.2px}.badge-text{font-family:&apos;SF Mono&apos;,Menlo,Consolas,Monaco,monospace;font-weight:600;font-size:13px}</style></defs><rect width="1200" height="380" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="380" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" rx="16"/><circle cx="180" cy="90" r="140" fill="#4f46e5" class="pulse-sphere-1" filter="url(#softGlow)"/><circle cx="1020" cy="290" r="160" fill="#ec4899" class="pulse-sphere-2" filter="url(#softGlow)"/><circle cx="920" cy="70" r="90" fill="#06b6d4" filter="url(#softGlow)" opacity=".25"/><circle cx="320" cy="310" r="110" fill="#8b5cf6" filter="url(#softGlow)" opacity=".3"/><g stroke="#fff" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="380"/><line x1="300" x2="300" y1="0" y2="380"/><line x1="450" x2="450" y1="0" y2="380"/><line x1="600" x2="600" y1="0" y2="380"/><line x1="750" x2="750" y1="0" y2="380"/><line x1="900" x2="900" y1="0" y2="380"/><line x1="1050" x2="1050" y1="0" y2="380"/></g><g opacity=".45"><path fill="none" stroke="url(#cyanBlue)" stroke-width="2.5" d="M -50 140 C 250 80, 450 210, 750 150 C 950 110, 1100 200, 1250 160" class="stream-line"/><path fill="none" stroke="url(#primaryGlow)" stroke-width="2" d="M -50 250 C 200 310, 500 190, 800 260 C 1000 310, 1150 230, 1250 240" class="stream-fast"/></g><g class="floating-particle-1"><circle cx="120" cy="220" r="3.5" fill="#38bdf8" filter="url(#glow)"/><circle cx="1080" cy="140" r="4.5" fill="#f472b6" filter="url(#glow)"/></g><g class="floating-particle-2"><circle cx="280" cy="70" r="4" fill="#a78bfa" filter="url(#glow)"/><circle cx="950" cy="220" r="3" fill="#34d399" filter="url(#glow)"/></g><g class="floating-particle-3"><circle cx="840" cy="330" r="3.5" fill="#fb923c" filter="url(#glow)"/><circle cx="360" cy="320" r="2.5" fill="#60a5fa" filter="url(#glow)"/></g><g transform="translate(600, 55)"><rect width="350" height="34" x="-175" y="0" fill="url(#pillGrad)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1.2" rx="17"/><text x="0" y="21" fill="#c084fc" class="badge-text" letter-spacing="1" text-anchor="middle">⚡ HIGH-THROUGHPUT AI SERVING</text></g><text x="600" y="145" fill="#fff" class="title-text" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))" font-size="44" text-anchor="middle">Awesome Model Inference Servers</text><text x="600" y="195" fill="#94a3b8" class="subtitle-text" font-size="18" text-anchor="middle">Production LLM Serving Engines, PagedAttention, KV Cache Offloading &amp; Custom AI Silicon</text><text x="600" y="224" fill="#64748b" class="subtitle-text" font-size="14.5" text-anchor="middle">vLLM • SGLang • Triton • TensorRT-LLM • Ollama • llama.cpp • Groq • Cerebras • SambaNova</text><g><g transform="translate(210, 275) translate(0, 0)"><rect width="170" height="42" fill="#0f172a" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.2" rx="10"/><circle cx="22" cy="21" r="5" fill="#6366f1"/><text x="36" y="26" fill="#cbd5e1" class="badge-text" font-size="12">PagedAttention</text></g><g transform="translate(210, 275) translate(195, 0)"><rect width="190" height="42" fill="#0f172a" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" rx="10"/><circle cx="22" cy="21" r="5" fill="#a855f7"/><text x="36" y="26" fill="#cbd5e1" class="badge-text" font-size="12">Continuous Batching</text></g><g transform="translate(210, 275)